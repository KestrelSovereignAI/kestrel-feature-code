[project]
name = "kestrel-feature-code"
version = "0.2.0"
description = "Source-code reading + modification with constitutional approval for Kestrel Sovereign"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kestrel-sovereign-sdk>=0.4,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
]

[project.entry-points."kestrel_sovereign.features"]
CodeFeature = "kestrel_feature_code.feature:CodeFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
